<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>퍼프 연동 실험</title>
<!-- 실험 화면 — 앱 본체에서 링크하지 않습니다. 가짜 기기로만 돌고, 이 폰 안(localStorage "smokefree.puffs.v1")에만 저장합니다.
     서버로 보내지 않습니다. 외부 글꼴·스크립트를 부르지 않습니다. 설계: docs/PUFF-LINK.md -->
<style>
:root{--g0:#EEF8F3;--g1:#D7F0E3;--g2:#A8DDC3;--g4:#0E6B48;--g5:#0B5A3C;--g7:#084A31;
  --ink:#122423;--d2:#324744;--d3:#5A716D;--line:#E6F1EE;--coral:#F6796B;--warn:#8A5A00;--warn-bg:#FFF4DB;
  --focus-width:2px;--focus-offset:2px;--focus-color:var(--g4);}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--d2);letter-spacing:-.01em;
  background:var(--g7);display:flex;justify-content:center;min-height:100vh;word-break:keep-all;overflow-wrap:anywhere;line-height:1.55}
.wrap{width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#EEF8F3 0%,#FAFDFB 30%,#EEF8F3 100%);padding:22px 16px 48px}
:focus-visible{outline:var(--focus-width) solid var(--focus-color);outline-offset:var(--focus-offset)}
:focus:not(:focus-visible){outline:none}
h1{font-size:1.5rem;color:var(--ink);font-weight:800;margin:4px 2px 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 16px;box-shadow:0 12px 36px rgba(8,74,49,.08);margin-bottom:13px}
.sect{font-size:1.0625rem;font-weight:800;color:var(--g5);margin-bottom:8px}
.sub{font-size:0.9375rem;color:var(--d3)}
.notice{background:var(--warn-bg);border:1px solid #EBCB8A;border-radius:16px;padding:12px 14px;margin-bottom:13px;font-size:0.9375rem;color:var(--ink)}
.notice b{color:var(--warn)}
label{display:block;font-size:0.9375rem;font-weight:800;color:var(--d3);margin:12px 0 5px}
select,input{width:100%;min-height:44px;font-family:inherit;font-size:1rem;padding:10px 12px;border-radius:15px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:10px;padding:12px;border:none;border-radius:999px;
  font-family:inherit;font-weight:800;font-size:1rem;color:#fff;background:var(--g4);cursor:pointer}
.btn.ghost{background:#fff;color:var(--g5);border:1.5px solid var(--g2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:4px 11px;border-radius:999px;font-size:0.875rem;font-weight:800;background:var(--g1);color:var(--g5)}
.chip.off{background:var(--warn-bg);color:var(--warn)}
.big{font-size:2.25rem;font-weight:800;color:var(--ink);line-height:1.1}
.big small{font-size:1rem;font-weight:700;color:var(--d3)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.kv{margin-top:8px;font-size:0.9375rem}
.bars{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:72px;margin-top:10px}
.bars i{display:block;background:var(--g2);border-radius:3px 3px 0 0;min-height:2px}
.axis{display:flex;justify-content:space-between;font-size:0.8125rem;color:var(--d3);margin-top:3px}
.msg{font-size:1rem;color:var(--ink)}
.hint{font-size:0.875rem;color:var(--d3);margin-top:6px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<main class="wrap">
  <h1>퍼프 연동 실험</h1>
  <p class="sub" style="margin:0 2px 12px">전자담배의 퍼프를 자동으로 모으는 흐름의 시험 화면이에요.</p>

  <div class="notice" role="note"><b>가짜 기기</b>로만 돌아요. 실제 전자담배·서버와 연결하지 않고, 아래 숫자는 <b>시험용으로 만든 가짜 기록</b>이에요. 기록은 이 폰 안에만 저장돼요.</div>

  <section class="card" aria-labelledby="h-dev">
    <div class="sect" id="h-dev">기기</div>
    <div class="row"><span class="chip" id="devChip">가짜 기기 · 연결 안 됨</span></div>
    <label for="selK">기기에 저장되는 퍼프 수 (링버퍼)</label>
    <select id="selK"><option value="0">저장 안 함</option><option value="16">16건</option><option value="64" selected>64건</option><option value="256">256건</option></select>
    <label for="selDisc">연결이 끊기는 정도</label>
    <select id="selDisc"><option value="none">끊기지 않음</option><option value="normal" selected>보통</option><option value="heavy">자주</option></select>
    <button class="btn" id="btnMake" type="button">지난 21일치 가짜 기록 만들기</button>
    <button class="btn ghost" id="btnLink" type="button" aria-pressed="false">연결 끊긴 상태로 보기</button>
    <p class="hint" id="devHint"></p>
  </section>

  <section class="card" aria-labelledby="h-today">
    <div class="sect" id="h-today">오늘</div>
    <div class="row"><span class="big" id="tCount">0<small> 퍼프</small></span></div>
    <div class="bars" id="bars" role="img" aria-label="시간대별 퍼프 수"></div>
    <div class="axis" aria-hidden="true"><span>0시</span><span>12시</span><span>24시</span></div>
    <label for="conc">액상 니코틴 농도 (mg/mL)</label>
    <input id="conc" type="number" inputmode="decimal" min="0" max="100" step="0.5" placeholder="예: 20">
    <p class="kv" id="nic">농도를 적으면 기화된 액상 속 니코틴 참고치를 보여 드려요.</p>
    <p class="hint">몸에 흡수된 양이 아니에요. 기기·액상에 따라 크게 달라지는 대략의 참고치예요.</p>
  </section>

  <section class="card" aria-labelledby="h-comp">
    <div class="sect" id="h-comp">수집 상태</div>
    <div class="big" id="cPct" aria-live="polite">—</div>
    <p class="kv" id="cNote"></p>
  </section>

  <section class="card" aria-labelledby="h-trend">
    <div class="sect" id="h-trend">최근 7일</div>
    <p class="msg" id="trend" aria-live="polite"></p>
    <p class="hint">앞선 2주 평균과 견줘요. 20% 이상 달라질 때만 알려 드려요.</p>
  </section>

  <button class="btn ghost" id="btnClear" type="button">이 화면의 가짜 기록 지우기</button>
</main>

<script src="puff-core.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  /* 저장소 탐지는 읽기만 합니다 — 같은 도메인의 다른 값을 덮어쓰거나 지우지 않게 (쓰기 실패는 save() 가 알려 줍니다) */
  var memStore = { _m: {}, getItem: function(k){ return this._m[k] || null; }, setItem: function(k, v){ this._m[k] = String(v); }, removeItem: function(k){ delete this._m[k]; } };
  var store = (function(){ try { localStorage.getItem(PuffCore.KEY); return localStorage; } catch(e){ return memStore; } })();
  var usingMem = store === memStore;
  var state = PuffCore.load(store);
  var link = { connected: false };                               // 가짜 연결 상태 (화면 안에서만)
  var DAY = PuffCore.DAY;

  function midnight(ms){ var d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
  function hhmm(ms){ var d = new Date(ms); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }

  function render(){
    var now = Date.now(), has = state.puffs.length > 0;
    $("devChip").textContent = "가짜 기기 · " + (link.connected ? "연결됨" : "연결 안 됨");
    $("devChip").className = "chip" + (link.connected ? "" : " off");
    $("btnLink").setAttribute("aria-pressed", String(has && !link.connected));
    $("btnLink").disabled = !has;
    $("btnLink").textContent = link.connected ? "연결 끊긴 상태로 보기" : "다시 연결하기";
    $("devHint").textContent = has ? "기기가 보낸 기록 " + state.puffs.length + "건을 이 폰에 갖고 있어요." : "아직 받은 기록이 없어요.";

    var day = PuffCore.daySummary(state, midnight(now));
    $("tCount").innerHTML = day.count + "<small> 퍼프</small>";
    var max = Math.max.apply(null, day.hours.concat([1])), bars = $("bars");
    bars.innerHTML = "";
    day.hours.forEach(function(n, h){ var i = document.createElement("i"); i.style.height = Math.round(100 * n / max) + "%"; i.title = h + "시 " + n + "건"; bars.appendChild(i); });
    bars.setAttribute("aria-label", "시간대별 퍼프 수. 가장 많은 시간대는 " + (day.count ? day.hours.indexOf(Math.max.apply(null, day.hours)) + "시" : "없음"));

    var raw = $("conc").value, bad = $("conc").validity.badInput;         // 1e999 처럼 숫자로 인정되지 않는 입력은 값이 비어 오므로 badInput 으로 구별
    var conc = raw === "" ? NaN : Number(raw), concOk = PuffCore.concValid(conc), concBad = bad || (raw !== "" && !concOk);
    var allTimed = day.count > 0 && day.durN === day.count;           // 길이가 없는 퍼프가 섞이면 과소 표시가 되므로 보여 주지 않음
    var mg = (allTimed && concOk) ? PuffCore.nicotineMg(day.durS, conc) : null;
    $("conc").setAttribute("aria-invalid", String(concBad));
    $("nic").textContent = mg !== null ? "오늘 기화된 액상 속 니코틴 약 " + mg + " mg (참고치)"
      : (concBad ? "농도는 0보다 크고 " + PuffCore.MAX_CONC + " 이하로 적어 주세요."
      : (concOk && day.count && !allTimed ? "퍼프 길이를 모르는 기록이 섞여 있어 니코틴 참고치는 보여 드리지 않아요." : "농도를 적으면 기화된 액상 속 니코틴 참고치를 보여 드려요."));

    var c = PuffCore.completeness(state, link);
    if (c.status === "no-data"){ $("cPct").textContent = "—"; $("cNote").textContent = "기록을 받으면 얼마나 빠짐없이 모였는지 알려 드려요."; }
    else if (c.status === "pending"){ $("cPct").textContent = "동기화 대기"; $("cNote").textContent = "기기와 연결이 끊겨 있어요. 마지막으로 받은 시각 " + (c.lastSync ? hhmm(c.lastSync) : "—") + ". 연결되면 끊긴 동안의 기록을 가져와요."; }
    else { $("cPct").textContent = c.pct + "%"; $("cNote").textContent = "기기가 보낸 번호 기준 " + c.known + "건 중 " + c.received + "건을 받았어요" + (c.missing ? " (빠진 것 " + c.missing + "건)." : "."); }

    $("trend").textContent = has ? PuffCore.trendText(PuffCore.weeklyTrend(state, now, link)) : "기록이 쌓이면 최근 7일을 앞선 2주와 견줘 드려요.";
    $("btnClear").disabled = !has;
  }

  $("btnMake").addEventListener("click", function(){
    var now = Date.now(), from = midnight(now) - 20 * DAY;
    state = PuffCore.newState();                                 // 시험용이라 매번 새로 만듭니다 (기간이 겹쳐 쌓이지 않게)
    var sim = PuffCore.simulateDevice(from, now, { seed: (now % 100000) + 1, bufferK: +$("selK").value, disconnects: $("selDisc").value });
    var r = PuffCore.ingest(state, sim.records, "live", now);
    state.emu = { withheld: sim.withheld };                                // 아직 끊겨 있어 기기에 남아 있는 꼬리 — 재연결하면 가져옴
    var saved = PuffCore.save(store, state);                               // emu 까지 저장해야 새로 고침 뒤에도 꼬리를 가져올 수 있음
    link.connected = PuffCore.linkAt(sim.intervals, now).connected;       // 끊긴 구간이 지금을 덮으면 동기화 대기로
    render();
    $("devHint").textContent = "가짜 기기가 만든 " + sim.truth + "건 중 " + r.added + "건이 도착했어요." + ((saved && !usingMem) ? "" : " 이 폰에 저장하지 못해 화면을 닫으면 사라져요.");
  });
  $("btnLink").addEventListener("click", function(){
    if (!link.connected) { PuffCore.reconnect(state, Date.now()); PuffCore.save(store, state); }   // 다시 연결하면 끊긴 동안 쌓인 기록을 가져옴
    link.connected = !link.connected; render();
  });
  $("conc").addEventListener("input", render);
  $("btnClear").addEventListener("click", function(){
    if (!confirm("이 화면의 가짜 기록을 모두 지울까요? 금연노트의 다른 기록은 그대로예요.")) return;
    state = PuffCore.newState(); store.removeItem(PuffCore.KEY); link.connected = false; render();
  });
  render();
})();
</script>
</body>
</html>
